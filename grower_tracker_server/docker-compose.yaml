services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: grower_tracker
      POSTGRES_PASSWORD: "bzgzX68bkoM3S_b2Qf0gXdk6ZQv4qeao"
    volumes:
      - grower_tracker_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "eU_Q4eQS3KCvD1pO542Gz8Ez2OiU_jNe"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: grower_tracker_test
      POSTGRES_PASSWORD: "pfxl4Tp59arRQzVqby4wBxwD8lUzN_gg"
    volumes:
      - grower_tracker_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "5RfHrCIH4RDav2yf6iOBKH36mHJzz9mt"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  grower_tracker_data:
  grower_tracker_test_data:
